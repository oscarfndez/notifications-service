spring.application.name=notifications
server.port=8080

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.oscarfndez=${LOGGING_LEVEL_APP:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notifications}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:oscar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jms.pub-sub-domain=true
spring.jms.listener.auto-startup=${JMS_LISTENER_AUTO_STARTUP:true}
spring.jms.listener.subscription-durable=true
spring.jms.listener.client-id=${JMS_CLIENT_ID:notifications-service}
spring.activemq.broker-url=${SPRING_ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${SPRING_ACTIVEMQ_USER:admin}
spring.activemq.password=${SPRING_ACTIVEMQ_PASSWORD:admin}

user.events.topic=${USER_EVENTS_TOPIC:games-collection.user-events}
user.events.subscription=${USER_EVENTS_SUBSCRIPTION:notifications-service-user-events}
inventory.events.topic=${INVENTORY_EVENTS_TOPIC:games-collection.inventory-events}
inventory.events.subscription=${INVENTORY_EVENTS_SUBSCRIPTION:notifications-service-inventory-events}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
